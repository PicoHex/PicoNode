# PicoNode Release — NuGet publish
# Triggered by tags shaped like v*, or by a manual dispatch that names the version.
# Nothing reaches nuget.org until the `verify` job has built, tested and accepted
# the version: `publish` runs only on `needs: verify`.

name: release

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, <year>.<x>.<y> (e.g. 2026.10.0). A dispatch carries no tag."
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  # The gate. Before this job existed the workflow published untested code while
  # AGENTS.md and scripts/release.ps1 both claimed it ran the tests, and a
  # workflow_dispatch packed seven packages labelled `main`.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }

      # No PACKAGE_VERSION write here: jobs do not share $GITHUB_ENV, so a write in
      # `verify` is dead code in `publish` — `publish` resolves the version itself.
      - name: Assert the release version shape
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          version="${version#v}"
          echo "$version" | grep -Eq '^[0-9]{4}\.[0-9]+\.[0-9]+$'
          echo "Release version: $version"

      - name: Restore
        run: dotnet restore PicoNode.slnx

      - name: Build
        run: dotnet build PicoNode.slnx --no-restore -c Release

      - name: Test every suite
        run: |
          set -euo pipefail
          for p in tests/PicoNode.Tests/PicoNode.Tests.csproj \
                   tests/PicoNode.Http.Tests/PicoNode.Http.Tests.csproj \
                   tests/PicoJsonRpc.Tests/PicoJsonRpc.Tests.csproj \
                   tests/PicoNode.Web.Tests/PicoNode.Web.Tests.csproj \
                   tests/PicoWeb.Tests/PicoWeb.Tests.csproj \
                   tests/PicoWeb.Integration.Tests/PicoWeb.Integration.Tests.csproj \
                   tests/PicoWeb.DI.Tests/PicoWeb.DI.Tests.csproj \
                   tests/PicoNode.Smoke/PicoNode.Smoke.csproj \
                   tests/PicoNode.PerfHarness/PicoNode.PerfHarness.csproj \
                   tests/PicoNode.Docs.Tests/PicoNode.Docs.Tests.csproj; do
            dotnet test --project "$p" --no-build -c Release
          done

      # Drift is only a warning (the x bump is a human decision), but comparing
      # *nothing* is a failure: a `find` matching no DLL iterates zero times, so
      # the step used to report success having checked no assembly at all.
      - name: Assert the API surface still bumps x
        run: |
          set -euo pipefail
          compared=0
          for dll in $(find src -path '*/bin/Release/net10.0/*.dll' \
                       \( -name 'PicoNode*.dll' -o -name 'PicoWeb.dll' -o -name 'PicoJsonRpc.dll' \) \
                       -not -path '*/ref/*'); do
            id=$(basename "$dll" .dll)
            [ -f "api/$id.public.txt" ] || continue
            dotnet run --project scripts/api-surface -c Release -- dump "$dll" --out "/tmp/$id.public.txt"
            compared=$((compared + 1))
            if ! diff -q "api/$id.public.txt" "/tmp/$id.public.txt" >/dev/null; then
              echo "::warning::$id public surface differs from the last release — confirm an x bump"
            fi
          done
          if [ "$compared" -eq 0 ]; then
            echo "::error::the API-surface check compared no assemblies — the build wrote no package DLL under src/**/bin/Release/net10.0, so this gate proved nothing"
            exit 1
          fi
          echo "API surface compared for $compared assemblies"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set version from the tag or the dispatch input
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          version="${version#v}"
          echo "$version" | grep -Eq '^[0-9]{4}\.[0-9]+\.[0-9]+$'
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      # Pack in dependency order with UseProjectReferences=false.
      # Each csproj uses conditional ItemGroup to select between
      # ProjectReference (dev) and PackageReference (pack/release).

      - name: Pack PicoNode.Abs
        run: >
          dotnet pack src/Network/PicoNode.Abs/PicoNode.Abs.csproj
          -c Release -p:Version=${{ env.PACKAGE_VERSION }}
          -p:UseProjectReferences=false
          -o packages

      - name: Pack PicoNode
        run: >
          dotnet pack src/Network/PicoNode/PicoNode.csproj
          -c Release -p:Version=${{ env.PACKAGE_VERSION }}
          -p:UseProjectReferences=false
          -p:RestoreAdditionalProjectSources=${{ github.workspace }}/packages
          -o packages

      - name: Pack PicoNode.Http
        run: >
          dotnet pack src/Http/PicoNode.Http/PicoNode.Http.csproj
          -c Release -p:Version=${{ env.PACKAGE_VERSION }}
          -p:UseProjectReferences=false
          -p:RestoreAdditionalProjectSources=${{ github.workspace }}/packages
          -o packages
      - name: Pack PicoJsonRpc
        run: >
          dotnet pack src/Rpc/PicoJsonRpc/PicoJsonRpc.csproj
          -c Release -p:Version=${{ env.PACKAGE_VERSION }}
          -p:UseProjectReferences=false
          -p:RestoreAdditionalProjectSources=${{ github.workspace }}/packages
          -o packages

      - name: Pack PicoNode.Web.Session.Abs
        run: >
          dotnet pack src/Web/PicoNode.Web.Session.Abs/PicoNode.Web.Session.Abs.csproj
          -c Release -p:Version=${{ env.PACKAGE_VERSION }}
          -p:UseProjectReferences=false
          -o packages

      - name: Pack PicoNode.Web
        run: >
          dotnet pack src/Web/PicoNode.Web/PicoNode.Web.csproj
          -c Release -p:Version=${{ env.PACKAGE_VERSION }}
          -p:UseProjectReferences=false
          -p:RestoreAdditionalProjectSources=${{ github.workspace }}/packages
          -o packages

      - name: Pack PicoWeb
        run: >
          dotnet pack src/Web/PicoWeb/PicoWeb.csproj
          -c Release -p:Version=${{ env.PACKAGE_VERSION }}
          -p:UseProjectReferences=false
          -p:RestoreAdditionalProjectSources=${{ github.workspace }}/packages
          -o packages

      # No --skip-duplicate: a version that already exists on nuget.org is a
      # failure, not a silent no-op that leaves a green run behind.
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push packages/*.nupkg
          --api-key ${{ env.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json

      - name: Assert every package was published
        run: |
          set -euo pipefail
          actual=$(find packages -maxdepth 1 -name '*.nupkg' | wc -l)
          expected=$(grep -cE '^[[:space:]]*dotnet pack ' .github/workflows/release.yml)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::packed $actual .nupkg files but this workflow declares $expected dotnet pack steps"
            exit 1
          fi
          for p in packages/*.nupkg; do
            nuspec=$(unzip -p "$p" '*.nuspec')
            if [[ "$nuspec" != *"<version>${PACKAGE_VERSION}</version>"* ]]; then
              echo "::error::$p does not declare <version>${PACKAGE_VERSION}</version>"
              exit 1
            fi
          done
          echo "All $actual packages declare version $PACKAGE_VERSION"

      # A dispatch has no tag to attach a Release to; the packages are published,
      # the Release is what a tag push adds.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
