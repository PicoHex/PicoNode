# Unlist (never delete) a published version from NuGet.org.
#
# NuGet versions cannot be reused, so this is the remedy for a release that shipped under the
# wrong version: unlisting hides it from search and from resolution while consumers that pin it
# keep restoring. Dispatch-only - it never runs on push, and it requires `confirm: unlist`.
#
# Example: gh workflow run unlist.yml -f version=2026.4.7 -f confirm=unlist
#
# Auth is the same OIDC handshake release.yml uses: the job trades a GitHub identity token for a
# short-lived API key, so no stored key is involved. nuget.org matches that token against a trusted
# publishing policy that pins the WORKFLOW FILE NAME, so unlist needs its own policy (workflow file
# `unlist.yml`, scope `Unlist`, environment empty) - a policy registered for `release.yml` does not
# admit this workflow. Push-only scope is not enough either: a push-capable key is exactly why the
# first unlist run answered 403 for every package.

name: unlist

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to unlist, without the leading v (e.g. 2026.4.7)'
        required: true
      packages:
        description: 'Package ids, space separated (default: every packaged project)'
        required: false
        default: ''
      confirm:
        description: 'Type unlist to confirm'
        required: true
        default: ''

permissions:
  contents: read
  # Same declaration as release.yml: the OIDC token is what nuget.org trades for the temp key.
  id-token: write

jobs:
  unlist:
    if: "inputs.confirm == 'unlist' && inputs.version != ''"
    runs-on: ubuntu-latest
    name: unlist ${{ inputs.version }}
    permissions:
      contents: read
      # GitHub OIDC: lets this job mint the identity token nuget.org trades for a
      # short-lived API key. Without it the login step has nothing to present.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve the package ids
        id: ids
        shell: bash
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            list="${{ inputs.packages }}"
          else
            # Every packaged project pins its id; the source generators and the samples have none.
            list=$(grep -rhoE '<PackageId>[^<]+' src --include='*.csproj' | sed 's/<PackageId>//' | sort -u | tr '\n' ' ')
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "unlisting ${{ inputs.version }}: $list"

      # Immediately before the step that consumes it: a temp key lives one hour and one OIDC
      # token buys exactly one key, so the handshake cannot be hoisted above the id resolution.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Unlist ${{ inputs.version }}
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for id in ${{ steps.ids.outputs.list }}; do
            echo "::group::$id ${{ inputs.version }}"
            if dotnet nuget delete "$id" "${{ inputs.version }}" \
                 --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
                 --source https://api.nuget.org/v3/index.json \
                 --non-interactive; then
              echo "$id: unlisted"
            else
              # Already unlisted (or never published) is not a failure of this workflow.
              echo "::warning::$id ${{ inputs.version }} was not unlisted (already unlisted, never published, or the key lacks permission)"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "### Unlisted \`${{ inputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          for id in ${{ steps.ids.outputs.list }}; do
            echo "- $id" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed package(s) reported an error above"
          fi
