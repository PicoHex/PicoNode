# PicoNode CI — validation pipeline
# Tier 3: multi-component framework with AOT validation
# Runs on PR and push to main

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64]
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.rid }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      # PicoJsonRpc.Tests starts REAL children (`node <fixture>`). Without a runtime
      # the suite takes its loud-skip path and reports 21 skipped on every run —
      # a green build covering a third less than it claims. Pinned to a major (the
      # fixtures use plain ESM + `node:readline` with no npm dependencies, so there
      # is nothing to cache): `latest` would move the runtime under the wire tests
      # and make a conformance regression indistinguishable from a node upgrade.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Linux AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # No locked mode: nothing is committed to lock AGAINST. The declarations in
      # Directory.Packages.props float on purpose, and the packages.lock.json a
      # restore writes is a local record of what this leg resolved -- gitignored,
      # never reviewed, never replayed. The record still has to survive the run, so
      # it leaves as the `resolved-versions` artifact uploaded below.
      #
      # This restore is deliberately RID-NEUTRAL and must stay that way: the
      # RuntimeIdentifiers injected by PublishAot's default publish RID are
      # disabled in Directory.Build.props. Nothing is committed any more, so a
      # `net10.0/<host-rid>` section cannot reach a review, but neutrality is what
      # keeps this restore comparable with a restore on any other machine.
      # Consequence: this restore produces NO RID-specific assets, so a publish
      # cannot use --no-restore here — each AOT publish below carries its own
      # -r and lets publish restore that RID's assets.
      - name: Restore
        run: dotnet restore PicoNode.slnx

      - name: Build
        run: dotnet build PicoNode.slnx --no-restore -c Release

      # The resolved versions, as data instead of as a committed file. Restore writes
      # `packages.lock.json` beside every project (RestorePackagesWithLockFile=true in
      # Directory.Build.props) and .gitignore keeps it out of the tree; uploading it here
      # is what makes "which exact versions did this build use" answerable after the
      # runner is gone -- the one job the tracked lock used to do.
      # `if: always()` on purpose: a leg that fails after restore still produced a
      # resolution, and that is exactly the run somebody needs to inspect.
      - name: Upload resolved versions (restore record)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-versions-${{ matrix.rid }}
          path: |
            **/packages.lock.json
          if-no-files-found: warn
          retention-days: 30

      - name: Test PicoNode.Abs
        run: dotnet test --project tests/PicoNode.Tests/PicoNode.Tests.csproj --no-build -c Release

      - name: Test PicoNode.Http
        run: dotnet test --project tests/PicoNode.Http.Tests/PicoNode.Http.Tests.csproj --no-build -c Release

      - name: Test PicoJsonRpc
        run: dotnet test --project tests/PicoJsonRpc.Tests/PicoJsonRpc.Tests.csproj --no-build -c Release

      - name: Test PicoNode.Web
        run: dotnet test --project tests/PicoNode.Web.Tests/PicoNode.Web.Tests.csproj --no-build -c Release

      - name: Test PicoWeb (host + generators)
        run: dotnet test --project tests/PicoWeb.Tests/PicoWeb.Tests.csproj --no-build -c Release

      - name: Test PicoWeb integration
        run: dotnet test --project tests/PicoWeb.Integration.Tests/PicoWeb.Integration.Tests.csproj --no-build -c Release

      - name: Test PicoWeb.DI
        run: dotnet test --project tests/PicoWeb.DI.Tests/PicoWeb.DI.Tests.csproj --no-build -c Release

      - name: Test PicoNode.Smoke
        run: dotnet test --project tests/PicoNode.Smoke/PicoNode.Smoke.csproj --no-build -c Release

      - name: Test PicoNode.PerfHarness
        run: dotnet test --project tests/PicoNode.PerfHarness/PicoNode.PerfHarness.csproj --no-build -c Release

      - name: Test README samples
        run: dotnet test --project tests/PicoNode.Docs.Tests/PicoNode.Docs.Tests.csproj --no-build -c Release

      # -f net10.0 is REQUIRED, not cosmetic: the samples are multi-targeted
      # (net10.0;net11.0), and `dotnet publish` on a multi-targeted project
      # without an explicit framework fails with NETSDK1129 "the project does
      # not have a single target framework". Pinning the framework also keeps
      # the published artifact byte-identical to the pre-multi-target one
      # (net10.0 AOT), so the native smoke runs below still validate the same
      # code path. The -r is still what makes publish restore that RID's
      # assets (this restore is RID-neutral by design, see above), so no
      # --no-restore here.
      - name: AOT publish (sample HTTP server)
        run: >
          dotnet publish samples/PicoNode.Samples.Http/PicoNode.Samples.Http.csproj
          -f net10.0
          -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true --self-contained
          -o publish/${{ matrix.rid }}

      - name: AOT publish + run verification (PicoWeb)
        shell: pwsh
        run: ./scripts/test-aot-publish.ps1 -RuntimeIdentifier ${{ matrix.rid }}

      - name: AOT publish (Echo server)
        run: >
          dotnet publish samples/PicoNode.Samples.Echo/PicoNode.Samples.Echo.csproj
          -f net10.0
          -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true --self-contained
          -o publish-echo/${{ matrix.rid }}

      - name: AOT publish (PicoJsonRpc.Sample) + run smoke
        run: >
          dotnet publish samples/PicoJsonRpc.Sample/PicoJsonRpc.Sample.csproj
          -f net10.0
          -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true --self-contained
          -o publish-jsonrpc/${{ matrix.rid }}

      - name: Run PicoJsonRpc.Sample (linux smoke, self-spawn round trip)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          "$GITHUB_WORKSPACE/publish-jsonrpc/linux-x64/PicoJsonRpc.Sample"

      # Full-stack SSE end-to-end harness (TCP -> HTTP -> PicoWeb -> SSE).
      # The script builds and starts its own test server on port 18789 and
      # exits non-zero on any failure; the Playwright case self-skips when the
      # package is absent (the runner has no Playwright).
      - name: Run SSE E2E harness (linux smoke)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          python3 tests/PicoNode.E2E/test_sse_streaming.py


  # HTTP/2 protocol conformance gate (h2spec v2.6.0, strict suite).
  # The script downloads the linux h2spec binary, builds the sample server
  # and fails the job on any failing test case.
  h2spec:
    runs-on: ubuntu-latest
    name: h2spec protocol conformance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Run h2spec (strict)
        shell: pwsh
        run: ./scripts/run-h2spec.ps1

      - name: Upload h2spec logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2spec-logs
          path: .tools/h2spec-ci.log
          if-no-files-found: ignore

  # WebSocket protocol conformance gate (Autobahn Testsuite, official frozen
  # image). The fuzzing client container drives 500+ RFC 6455 cases against
  # the sample server over the host network; any FAILED case fails the job.
  autobahn:
    runs-on: ubuntu-latest
    name: autobahn WebSocket conformance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Run Autobahn fuzzing client
        shell: pwsh
        run: ./scripts/run-autobahn.ps1

      - name: Upload autobahn logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-logs
          path: |
            .tools/autobahn-ci.log
            .tools/autobahn-reports/servers/index.json
          if-no-files-found: ignore

  # Dependency policy gate (R1-R7, R7b, R10 of picohex-dependency-policy).
  # The checker is vendored: scripts/check-dependency-policy.sh carries the same
  # bytes in every PicoHex repo and names the canonical source in its header.
  policy:
    name: dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the dependency policy
        run: bash scripts/check-dependency-policy.sh .
